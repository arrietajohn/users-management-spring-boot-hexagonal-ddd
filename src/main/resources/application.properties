# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=8080

# Se excluye la auto-configuracion manual para User (JDBC puro)
# JPA se mantiene activo para Votacion
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# =============================================
# Configuracion de Base de Datos MySQL (JPA)
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/crud_usuarios
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Propiedades originales para DataSource manual
db.host=localhost
db.port=3306
db.name=crud_usuarios
db.username=root
db.password=

# =============================================
# Configuracion SMTP (JavaMail)
# =============================================
smtp.host=smtp.gmail.com
smtp.port=587
smtp.username=tu_correo@gmail.com
smtp.password=tu_app_password_aqui
smtp.from.address=tu_correo@gmail.com
smtp.from.name=Gestion de Usuarios